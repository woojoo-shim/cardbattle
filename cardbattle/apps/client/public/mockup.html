<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Card Battle — Redesign Mockup</title>
<style>
  :root{
    --void:#07080d; --stage:#0e1018; --panel:#161a26; --panel-hi:#1f2434;
    --border:#2c3142; --text:#e7e9f2; --dim:#8b90a6; --faint:#565c72;
    --you:#38e8c8; --enemy:#ff3b6b; --rare:#f4c44a; --magic:#8b6cff;
    --mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    --sans:"Geist",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans); color:var(--text); overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 8%, #141826 0%, var(--stage) 38%, var(--void) 100%),
      var(--void);
  }
  /* edge vignette */
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;
    box-shadow:inset 0 0 220px 60px rgba(0,0,0,.75);}

  .screen{height:100vh;display:grid;
    grid-template-rows:64px 34% 1fr 116px 188px;}

  /* ---------- 1. TOP BAR ---------- */
  .topbar{display:flex;align-items:center;gap:24px;padding:0 24px;
    border-bottom:1px solid var(--border);
    background:linear-gradient(180deg,rgba(56,232,200,.10),transparent 80%);
    position:relative;z-index:20;}
  .round{font-family:var(--mono);font-size:13px;color:var(--dim);letter-spacing:2px}
  .round b{color:var(--text)}
  .turn-ribbon{flex:1;display:flex;justify-content:center}
  .turn-pill{display:flex;align-items:center;gap:10px;padding:8px 22px;border-radius:999px;
    background:rgba(56,232,200,.12);border:1px solid var(--you);
    color:var(--you);font-weight:800;font-size:20px;letter-spacing:1px;
    box-shadow:0 0 30px rgba(56,232,200,.25);}
  .turn-pill .dot{width:9px;height:9px;border-radius:50%;background:var(--you);
    box-shadow:0 0 12px var(--you);animation:pulse 1.6s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .timer{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:20px;color:var(--text)}
  .timer .ring{--p:76; width:34px;height:34px;border-radius:50%;
    background:conic-gradient(var(--you) calc(var(--p)*1%), #21263a 0);
    -webkit-mask:radial-gradient(farthest-side,transparent 60%,#000 62%);
            mask:radial-gradient(farthest-side,transparent 60%,#000 62%);}
  .logbtn{font-family:var(--mono);font-size:12px;color:var(--dim);
    border:1px solid var(--border);border-radius:8px;padding:7px 12px;cursor:pointer;background:transparent}

  /* ---------- 2. ENEMY LINEUP ---------- */
  .lineup{display:flex;align-items:center;justify-content:center;gap:22px;padding:0 24px}
  .enemy{position:relative;width:108px;display:flex;flex-direction:column;align-items:center;gap:8px;
    transition:transform .25s}
  .portrait{width:96px;height:104px;border-radius:14px;position:relative;overflow:hidden;
    background:linear-gradient(160deg,var(--panel-hi),var(--panel));
    border:1px solid var(--border);
    box-shadow:0 10px 24px rgba(0,0,0,.5);
    display:flex;align-items:center;justify-content:center}
  .portrait .face{font-size:40px;filter:saturate(.85)}
  .ename{font-size:12px;color:var(--dim);font-weight:600}
  .ehp{width:96px}
  .hpbar{height:9px;border-radius:6px;background:#0c0f18;border:1px solid var(--border);overflow:hidden}
  .hpbar > i{display:block;height:100%;border-radius:6px;
    background:linear-gradient(90deg,#ff6b8f,var(--enemy))}
  .ehp .row{display:flex;justify-content:space-between;align-items:center;margin-top:3px}
  .ehp .val{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .badge{position:absolute;top:6px;width:24px;height:24px;border-radius:7px;display:flex;
    align-items:center;justify-content:center;font-size:12px;font-family:var(--mono);font-weight:700;
    border:1px solid var(--border);background:rgba(10,12,20,.85)}
  .badge.def{left:6px;color:#7fb6ff}
  .badge.st{right:6px;color:var(--magic)}
  /* current turn spotlight */
  .enemy.active{transform:translateY(-10px)}
  .enemy.active .portrait{border-color:var(--enemy);
    box-shadow:0 0 0 1px var(--enemy),0 18px 40px rgba(255,59,107,.35)}
  .enemy.active::after{content:"";position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);
    width:130px;height:46px;border-radius:50%;
    background:radial-gradient(ellipse,rgba(255,59,107,.35),transparent 70%)}
  /* targetable */
  .enemy.target .portrait{border-color:var(--enemy);cursor:crosshair;
    box-shadow:0 0 0 1px var(--enemy),0 0 26px rgba(255,59,107,.45)}
  .enemy.target .crosshair{position:absolute;inset:0;border:1px dashed var(--enemy);border-radius:14px;
    animation:spin 6s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* dead */
  .enemy.dead{filter:grayscale(1);opacity:.4}
  .enemy.dead .portrait{transform:rotate(-3deg)}
  .enemy.dead .skull{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:34px}

  /* ---------- 3. BATTLEFIELD ---------- */
  .field{position:relative;display:flex;align-items:center;justify-content:center}
  .field .grid{position:absolute;inset:0;
    background-image:linear-gradient(rgba(56,232,200,.04) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(56,232,200,.04) 1px,transparent 1px);
    background-size:40px 40px;mask:radial-gradient(60% 70% at 50% 50%,#000,transparent)}
  .projectile{position:absolute;left:46%;top:60%;font-size:26px;
    filter:drop-shadow(0 0 10px var(--enemy));
    animation:fly 1.8s ease-out infinite}
  @keyframes fly{0%{left:48%;top:80%;opacity:0}15%{opacity:1}100%{left:38%;top:14%;opacity:0;transform:rotate(45deg)}}
  .field .hint{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:3px}

  /* ---------- 4. HERO PANEL ---------- */
  .heroWrap{display:flex;align-items:center;justify-content:center}
  .hero{width:min(760px,92%);height:88px;border-radius:16px;display:flex;align-items:center;gap:18px;
    padding:0 22px;position:relative;
    background:linear-gradient(180deg,var(--panel-hi),var(--panel));
    border:1px solid var(--border);border-top-color:#39405a;
    box-shadow:0 -2px 0 rgba(255,255,255,.04) inset,0 22px 50px rgba(0,0,0,.6)}
  .hero .ava{width:60px;height:60px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:30px;background:#0e1220;border:1px solid var(--you);
    box-shadow:0 0 22px rgba(56,232,200,.3)}
  .hero .info{flex:1}
  .hero .name{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .hero .name b{font-size:18px}
  .hero .name .you{font-family:var(--mono);font-size:11px;color:var(--you);
    border:1px solid var(--you);border-radius:6px;padding:1px 7px}
  .hpbig{height:20px;border-radius:8px;background:#0a0d15;border:1px solid var(--border);
    position:relative;overflow:hidden;display:flex;gap:2px;padding:2px}
  .hpbig .seg{flex:1;border-radius:3px;background:#1b2030}
  .hpbig .seg.on{background:linear-gradient(90deg,#5af0d3,var(--you))}
  .hero .stat{display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:120px}
  .hero .num{font-family:var(--mono);font-size:30px;font-weight:700;line-height:1}
  .hero .badges{display:flex;gap:6px}
  .sbadge{display:flex;align-items:center;gap:4px;font-family:var(--mono);font-size:12px;
    padding:3px 8px;border-radius:999px;border:1px solid var(--border);background:rgba(10,12,20,.7)}
  .sbadge.fire{color:#ff8a5c;border-color:#5a3324}
  .sbadge.pois{color:var(--magic);border-color:#3a2f5a}
  .sbadge.def{color:#7fb6ff;border-color:#243a5a}

  /* ---------- 5. HAND DOCK ---------- */
  .dock{position:relative;display:flex;align-items:flex-end;justify-content:center}
  .fan{display:flex;align-items:flex-end;justify-content:center;height:100%;padding-bottom:18px}
  .card{width:92px;height:128px;border-radius:12px;margin:0 -6px;position:relative;cursor:pointer;
    background:linear-gradient(170deg,#1c2233,#11151f);
    border:1px solid var(--border);
    box-shadow:0 14px 26px rgba(0,0,0,.55);
    transition:transform .18s ease,box-shadow .18s ease;
    display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:12px 8px}
  .card:nth-child(1){transform:rotate(-10deg) translateY(10px)}
  .card:nth-child(2){transform:rotate(-5deg) translateY(2px)}
  .card:nth-child(3){transform:rotate(0deg)}
  .card:nth-child(4){transform:rotate(5deg) translateY(2px)}
  .card:nth-child(5){transform:rotate(10deg) translateY(10px)}
  .card:hover{transform:translateY(-22px) scale(1.08) rotate(0);z-index:5;
    box-shadow:0 26px 44px rgba(0,0,0,.6)}
  .card.sel{transform:translateY(-30px) scale(1.1) rotate(0);z-index:6;
    border-color:var(--you);box-shadow:0 0 0 1px var(--you),0 26px 44px rgba(56,232,200,.3)}
  .card.rare{border-color:var(--magic)}
  .card.epic{border-color:var(--rare)}
  .card .ico{font-size:34px}
  .card .cn{font-size:13px;font-weight:700}
  .card .cv{font-family:var(--mono);font-size:12px;padding:2px 9px;border-radius:999px}
  .cv.dmg{color:#ffd0db;background:rgba(255,59,107,.16);border:1px solid #5a2436}
  .cv.heal{color:#bff6ec;background:rgba(56,232,200,.16);border:1px solid #1f5a4c}
  .card.epic .ico{filter:drop-shadow(0 0 8px var(--rare))}

  .endturn{position:absolute;right:32px;bottom:30px;padding:13px 24px;border-radius:10px;border:none;
    cursor:pointer;font-weight:800;font-size:16px;color:#04231b;font-family:var(--sans);
    background:linear-gradient(180deg,#5af0d3,#22c7a8);
    box-shadow:0 8px 20px rgba(56,232,200,.35);transition:transform .15s}
  .endturn:hover{transform:translateY(-2px)}

  /* log peek */
  .logpeek{position:absolute;right:24px;top:80px;width:230px;z-index:15;
    background:linear-gradient(180deg,rgba(22,26,38,.96),rgba(14,16,24,.96));
    border:1px solid var(--border);border-radius:12px;padding:12px 14px;
    box-shadow:0 18px 40px rgba(0,0,0,.5)}
  .logpeek h4{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:2px;margin-bottom:8px}
  .logpeek .line{font-size:12px;color:var(--dim);padding:3px 0;border-top:1px solid #1b1f2c}
  .logpeek .line:first-of-type{border-top:none}
  .logpeek .dmg{color:#ff8aa6}.logpeek .heal{color:#7fe9d6}.logpeek .turn{color:var(--dim)}
</style>
</head>
<body>
  <div class="screen">

    <!-- 1 TOP BAR -->
    <div class="topbar">
      <div class="round">☠ ROUND <b>3</b> · 생존 <b>4</b>/6</div>
      <div class="turn-ribbon">
        <div class="turn-pill"><span class="dot"></span>당신의 턴</div>
      </div>
      <div class="timer"><span class="ring"></span>23</div>
      <button class="logbtn">≡ 로그</button>
    </div>

    <!-- 2 ENEMY LINEUP -->
    <div class="lineup">
      <div class="enemy">
        <div class="portrait"><span class="badge def">🛡4</span><span class="face">🧙</span></div>
        <div class="ehp">
          <div class="hpbar"><i style="width:70%"></i></div>
          <div class="row"><span class="ename">적 A</span><span class="val">28/40</span></div>
        </div>
      </div>
      <div class="enemy active">
        <div class="portrait"><span class="badge st">🔥2</span><span class="face">👺</span></div>
        <div class="ehp">
          <div class="hpbar"><i style="width:100%"></i></div>
          <div class="row"><span class="ename">적 B · 턴</span><span class="val">40/40</span></div>
        </div>
      </div>
      <div class="enemy target">
        <div class="portrait"><span class="crosshair"></span><span class="face">🤖</span></div>
        <div class="ehp">
          <div class="hpbar"><i style="width:33%"></i></div>
          <div class="row"><span class="ename">적 C ◎</span><span class="val">13/40</span></div>
        </div>
      </div>
      <div class="enemy dead">
        <div class="portrait"><span class="face">💀</span><span class="skull">☠</span></div>
        <div class="ehp">
          <div class="hpbar"><i style="width:0%"></i></div>
          <div class="row"><span class="ename">적 D</span><span class="val">DEAD</span></div>
        </div>
      </div>
      <div class="enemy">
        <div class="portrait"><span class="face">🐲</span></div>
        <div class="ehp">
          <div class="hpbar"><i style="width:90%"></i></div>
          <div class="row"><span class="ename">적 E</span><span class="val">36/40</span></div>
        </div>
      </div>
    </div>

    <!-- 3 BATTLEFIELD -->
    <div class="field">
      <div class="grid"></div>
      <div class="projectile">🔱</div>
      <div class="hint">◈ BATTLEFIELD ◈</div>
      <!-- log peek floats here -->
      <div class="logpeek">
        <h4>전투 기록</h4>
        <div class="line turn">▶ 당신의 턴</div>
        <div class="line dmg">💥 적 C 13 피해 (HP 13)</div>
        <div class="line heal">💚 적 B 12 회복</div>
        <div class="line dmg">💥 나 7 피해 (HP 33)</div>
      </div>
    </div>

    <!-- 4 HERO PANEL -->
    <div class="heroWrap">
      <div class="hero">
        <div class="ava">🛡️</div>
        <div class="info">
          <div class="name"><b>테스터</b><span class="you">YOU</span></div>
          <div class="hpbig">
            <span class="seg on"></span><span class="seg on"></span><span class="seg on"></span>
            <span class="seg on"></span><span class="seg on"></span><span class="seg on"></span>
            <span class="seg on"></span><span class="seg on"></span><span class="seg"></span><span class="seg"></span>
          </div>
        </div>
        <div class="stat">
          <div class="num">33<span style="font-size:16px;color:var(--dim)">/40</span></div>
          <div class="badges">
            <span class="sbadge def">🛡 0</span>
            <span class="sbadge fire">🔥 2</span>
            <span class="sbadge pois">💀 1</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 5 HAND DOCK -->
    <div class="dock">
      <div class="fan">
        <div class="card"><span class="ico">🗡️</span><span class="cn">검</span><span class="cv dmg">10</span></div>
        <div class="card"><span class="ico">🏹</span><span class="cn">활</span><span class="cv dmg">7</span></div>
        <div class="card epic sel"><span class="ico">💣</span><span class="cn">폭탄</span><span class="cv dmg">12</span></div>
        <div class="card"><span class="ico">🧪</span><span class="cn">회복약</span><span class="cv heal">+12</span></div>
        <div class="card rare"><span class="ico">🔱</span><span class="cn">창</span><span class="cv dmg">13</span></div>
      </div>
      <button class="endturn">턴 종료 ▶</button>
    </div>

  </div>
</body>
</html>
