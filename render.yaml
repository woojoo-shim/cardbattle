services:
  - type: web
    name: cardbattle
    runtime: node
    plan: free
    rootDir: cardbattle
    buildCommand: corepack enable && corepack prepare pnpm@10.24.0 --activate && pnpm install && pnpm build
    startCommand: pnpm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
